weCloud:
  imageRegistry:
    gcp: us-east1-docker.pkg.dev/gcp-docker-kubernetes-bchristi

global:
  environment: gcp

profile:
  releaseName: "spring-profile"
  replicaCount: 3
  repository: "docker-repo"
  image: "task3-service"
  tag: "1.0.0"
  service:
    type: "NodePort"
    port: 80
    targetPort: 8080
  mysql:
    host: "mysql-profile.default.svc.cluster.local"
    user: "profileuser"
    password: "profilepass"
    port: "3306"
  hpa:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    cpuRequest: 200m

chat:
  releaseName: "spring-chat"
  replicaCount: 3
  repository: "docker-repo"
  image: "task4-chat"
  tag: "1.0.0"
  service:
    type: "NodePort"
    port: 80
    targetPort: 8080
  profileEndpoints: "spring-profile-service.default.svc.cluster.local"
  mysql:
    host: "mysql-chat.default.svc.cluster.local"
    user: "chatuser"
    password: "chatpass"
    port: "3306"
  hpa:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    cpuRequest: 200m

login:
  releaseName: "spring-login"
  replicaCount: 3
  repository: "docker-repo"
  image: "task4-login"
  tag: "1.0.0"
  service:
    type: "NodePort"
    port: 80
    targetPort: 8080
  chatEndpoint: "35.227.65.197"
  mysql:
    host: "mysql-login.default.svc.cluster.local"
    user: "loginuser"
    password: "loginpass"
    port: "3306"
  hpa:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    cpuRequest: 200m

# Below are the values used in the redis service
# DO NOT MODIFY
redis:
  image: "redis:7"
  host: "redis-service"
  password: "SuperSecretRedisPassword"
  passwordSecret: "redis-secret"
  passwordKey: "REDIS_PASSWORD"
  port: "6379"
  containerPort: 6379
  topic: "/topic/messages"
  service:
    port: 6379
    targetPort: 6379
